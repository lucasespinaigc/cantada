<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>abre aí</title>
    <style>
      :root {
        --fundo: #ffe4ec;
        --fundo-claro: #fff5f8;
        --tinta: #4a1022;
        --destaque: #e8436f;
        --destaque-tinta: #ffffff;
        --botao: #ffffff;
        --sombra: 0 8px 24px rgb(232 67 111 / 0.25);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 16px;
        overflow: hidden;
        background: radial-gradient(circle at 30% 20%, var(--fundo-claro), var(--fundo));
        color: var(--tinta);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }

      h1 {
        margin: 0 0 2rem;
        font-size: clamp(2rem, 9vw, 3.5rem);
      }

      .botoes {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      button {
        padding: 0.75rem 2.25rem;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-size: 1.25rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--sombra);
        touch-action: manipulation;
      }

      #sim {
        background: var(--destaque);
        color: var(--destaque-tinta);
        transform-origin: top center;
        transition: transform 0.3s ease;
      }

      #nao {
        max-width: calc(100vw - 32px);
        background: var(--botao);
        color: var(--tinta);
        transition:
          left 0.25s ease,
          top 0.25s ease,
          transform 0.25s ease;
      }

      #nao.solto {
        position: fixed;
        z-index: 1;
      }

      .resposta {
        display: none;
      }

      body.aceitou .pergunta {
        display: none;
      }

      body.aceitou .resposta {
        display: block;
      }

      .coracao {
        width: 120px;
        fill: var(--destaque);
        animation: pulsar 1s ease-in-out infinite;
      }

      .resposta h1 {
        margin-bottom: 0.75rem;
      }

      .contagem {
        margin: 0;
        font-size: 1.25rem;
        opacity: 0.8;
      }

      .chuva {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }

      .chuva svg {
        position: absolute;
        top: -48px;
        fill: var(--destaque);
        animation: cair linear infinite both;
      }

      @keyframes pulsar {
        50% {
          transform: scale(1.15);
        }
      }

      @keyframes cair {
        to {
          transform: translate(var(--deriva), calc(100vh + 96px)) rotate(var(--giro));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #sim,
        #nao {
          transition: none;
        }

        .coracao {
          animation: none;
        }

        .chuva {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="desenho-coracao" viewBox="0 0 24 24">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        />
      </symbol>
    </svg>

    <main class="pergunta">
      <h1>quer ficar cmg?</h1>
      <div class="botoes">
        <button id="sim" type="button">Sim</button>
        <button id="nao" type="button">Não</button>
      </div>
    </main>

    <main class="resposta" aria-live="polite">
      <div class="chuva" aria-hidden="true"></div>
      <svg class="coracao" viewBox="0 0 24 24" aria-hidden="true">
        <use href="#desenho-coracao" />
      </svg>
      <h1>eu já sabia</h1>
      <p class="contagem"></p>
    </main>

    <script>
      const sim = document.getElementById("sim");
      const nao = document.getElementById("nao");
      const margem = 16;
      const frases = [
        "Não",
        "tem certeza?",
        "pensa melhor",
        "última chance",
        "vai partir meu coração",
        "tá bom, aperta o sim",
      ];
      let fugas = 0;
      let ultimaFuga = -Infinity;

      // Deixa uma vaga do mesmo tamanho no lugar do botão, para o "Sim" não pular quando o "Não" sai da fila.
      function soltar() {
        const caixa = nao.getBoundingClientRect();
        const vaga = document.createElement("span");
        vaga.style.width = caixa.width + "px";
        vaga.style.height = caixa.height + "px";
        vaga.setAttribute("aria-hidden", "true");
        nao.before(vaga);
        nao.style.left = caixa.left + "px";
        nao.style.top = caixa.top + "px";
        nao.classList.add("solto");
        nao.getBoundingClientRect();
      }

      function sobrepoe(a, b) {
        return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
      }

      // offsetLeft e offsetTop ignoram o transform, então medem o "Sim" no tamanho original mesmo no meio da animação.
      function crescerSim() {
        const largura = sim.offsetWidth;
        const altura = sim.offsetHeight;
        const centro = sim.offsetLeft + largura / 2;
        const limite = Math.max(
          1,
          Math.min(
            (window.innerWidth - 2 * margem) / largura,
            (window.innerHeight - sim.offsetTop - margem) / altura,
          ),
        );
        const escala = Math.min(1 + fugas * 0.4, limite);
        const metade = (largura * escala) / 2;
        const alvo = Math.min(Math.max(centro, margem + metade), window.innerWidth - margem - metade);
        sim.style.transform = `translateX(${alvo - centro}px) scale(${escala})`;
      }

      function encolherNao() {
        nao.textContent = frases[Math.min(fugas, frases.length - 1)];
        nao.style.transform = `scale(${Math.max(0.6, 1 - fugas * 0.08)})`;
      }

      function fugir() {
        // Um toque dispara mais de um evento, e o botão pode passar debaixo do mouse enquanto voa: sem essa trava ele pularia frases.
        const agora = performance.now();
        if (agora - ultimaFuga < 250) return;
        ultimaFuga = agora;

        if (!nao.classList.contains("solto")) soltar();
        fugas++;
        encolherNao();
        crescerSim();

        const largura = nao.offsetWidth;
        const altura = nao.offsetHeight;
        const limiteX = Math.max(margem, window.innerWidth - largura - margem);
        const limiteY = Math.max(margem, window.innerHeight - altura - margem);
        const atual = nao.getBoundingClientRect();
        const caixaSim = sim.getBoundingClientRect();
        let x = margem;
        let y = margem;

        for (let tentativa = 0; tentativa < 30; tentativa++) {
          x = margem + Math.random() * (limiteX - margem);
          y = margem + Math.random() * (limiteY - margem);
          const destino = {
            left: x - margem,
            right: x + largura + margem,
            top: y - margem,
            bottom: y + altura + margem,
          };
          const longe = Math.hypot(x - atual.left, y - atual.top) > 120;
          if (longe && !sobrepoe(destino, caixaSim)) break;
        }

        nao.style.left = x + "px";
        nao.style.top = y + "px";
      }

      function chover() {
        const gotas = Array.from({ length: 40 }, () => {
          const tamanho = 14 + Math.random() * 26;
          const estilo = [
            `left: ${Math.random() * 100}%`,
            `width: ${tamanho}px`,
            `height: ${tamanho}px`,
            `opacity: ${0.4 + Math.random() * 0.6}`,
            `animation-duration: ${4 + Math.random() * 4}s`,
            `animation-delay: ${Math.random() * 5}s`,
            `--deriva: ${Math.random() * 80 - 40}px`,
            `--giro: ${Math.random() * 360 - 180}deg`,
          ].join("; ");
          return `<svg viewBox="0 0 24 24" style="${estilo}"><use href="#desenho-coracao" /></svg>`;
        });
        document.querySelector(".chuva").innerHTML = gotas.join("");
      }

      function contarFugas() {
        if (fugas === 0) return "e você nem pensou duas vezes";
        if (fugas === 1) return "e você ainda tentou fugir 1 vez";
        return `e você ainda tentou fugir ${fugas} vezes`;
      }

      nao.addEventListener("pointerenter", (evento) => {
        if (evento.pointerType === "mouse") fugir();
      });
      nao.addEventListener("pointerdown", (evento) => {
        evento.preventDefault();
        fugir();
      });
      // O clique de mouse e de toque já foi tratado no pointerdown; aqui só entra o Enter ou o Espaço do teclado.
      nao.addEventListener("click", (evento) => {
        evento.preventDefault();
        if (evento.detail === 0) fugir();
      });

      sim.addEventListener("click", () => {
        document.querySelector(".contagem").textContent = contarFugas();
        chover();
        document.body.classList.add("aceitou");
      });

      window.addEventListener("resize", () => {
        if (!nao.classList.contains("solto")) return;
        crescerSim();
        const x = Math.min(parseFloat(nao.style.left), window.innerWidth - nao.offsetWidth - margem);
        const y = Math.min(parseFloat(nao.style.top), window.innerHeight - nao.offsetHeight - margem);
        nao.style.left = Math.max(margem, x) + "px";
        nao.style.top = Math.max(margem, y) + "px";
      });
    </script>
  </body>
</html>
